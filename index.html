<!doctype html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Libertinus+Math&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Libertinus+Math&family=Lora:ital,wght@0,400..700;1,400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://db.onlinewebfonts.com/c/fd1ad3a0f95210975d2f5607501020b5?family=Norse"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="styles.css" rel="stylesheet" />
    <title>Document</title>
  </head>
  <body>
    <div class="fancy-side">
      <div class="logo-container">
        <img class="odin-logo" src="odin-logo.png" />
        <span class="logo-title">ODIN</span>
      </div>

      <div>
        <div class="photo-credit">
          <span
            >Photo by <em>Halie West</em> on
            <a href="https://unsplash.com/photos/25xggax4bSA">Unsplash</a></span
          >
        </div>
      </div>
    </div>

    <div class="form-side">
      <p class="inspiring-text">
        We believe that our product is way better than the other ones. You know
        that this is true <em>deep in your heart.</em> Also, you will give us a
        lot of money which is <em>great!</em>
      </p>
      <p class="exclamation">
        <em>Signing up</em> is the <em> best </em> thing you can do!
      </p>
      <form>
        <div class="form-container">
          <div>
            <label for="fst">First Name</label>
            <input type="text" name="fst" id="fst" />
          </div>

          <div>
            <label for="snd">Second Name</label>
            <input type="text" name="snd" id="snd" />
          </div>

          <div>
            <label for="email">E-Mail</label>
            <input type="email" name="email" id="email" />
          </div>

          <div>
            <label for="phone">Phone Number</label>
            <input type="tel" name="email" id="phone" />
          </div>

          <div>
            <label for="pw">Password</label>
            <input type="password" name="password" id="pw" />
          </div>

          <div>
            <label for="confirm-pw">Confirm Password</label>
            <input type="password" name="confirm-pw" id="confirm-pw" />
          </div>
        </div>
        <button>Create Account</button>
      </form>
      <div class="already-signed-up">
        Already have an account? <a href="index.html">Log in</a>
      </div>
    </div>
  </body>
</html>
